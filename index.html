<!doctype html>
<html lang="en">
  <head>
    <title>Heraclite E-1700</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>

    <model-viewer 
      id="heraclite-viewer"
      src="Heraclite-E-1700.glb" 
      camera-controls 
      interaction-prompt="none" 
      ar-modes="none"
      environment-image="legacy"
      exposure="1.5"
      shadow-intensity="2"
      shadow-softness="1"
      camera-orbit="-40deg 75deg auto"
      field-of-view="40deg"
      style="width: 100%; height: 500px; background-color: transparent;">
    </model-viewer>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <script>
      const viewer = document.querySelector('#heraclite-viewer');
      viewer.addEventListener('camera-ready', () => {
        viewer.animateCameraOrbit('-200deg 110deg auto', 10000, 'ease-in-out');
        setTimeout(() => {
          viewer.rotationPerSecond = "-1deg"; 
          viewer.autoRotate = true;           
        }, 10000);
      }, { once: true });
    </script>

  </body>
</html>
